[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "delta-loot-assistant"
version = "0.1.0"
description = "三角洲行动烽火地带只读最高收益理包助手"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary - personal prototype" }
authors = [{ name = "Delta Loot Assistant contributors" }]
dependencies = [
  "mss>=9.0",
  "numpy>=1.26,<2",
  "opencv-python>=4.10,<4.12",
  "onnxruntime>=1.19,<1.24",
  "ortools>=9.11,<9.12",
  "Pillow>=10.4",
  "PySide6>=6.8,<6.9",
  "rapidocr>=3.9,<4",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
ai = ["langchain-core==1.6.2"]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
]
build = [
  "pyinstaller>=6.11",
]

[project.scripts]
delta-loot-assistant = "delta_loot_assistant.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/delta_loot_assistant"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
